name: CI — planners, baselines, benchmarks

on:
  push:
    branches: [ main, master, paper-v2 ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint (new code)
      run: flake8 planner_core baselines benchmarks tests --max-line-length=110 --extend-ignore=E127

    - name: Lint (legacy scripts, syntax errors only)
      run: flake8 src scripts --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Unit tests
      run: python -m pytest -q

    - name: Benchmark smoke test
      run: |
        python -m benchmarks.runner configs/smoke.json --out /tmp/smoke --limit 40
        python -m benchmarks.analyze /tmp/smoke --no-figures
        test -s /tmp/smoke/summary.md

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the ROS2 image
      run: docker build -t hybrid-planner .

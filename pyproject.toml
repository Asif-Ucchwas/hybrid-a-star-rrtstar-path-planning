[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-astar-rrtstar"
version = "2.0.0.dev0"
description = "A*-seeded adaptive-corridor RRT* planner, baselines and reproducible benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Md Asifuzzaman" }]
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "flake8"]

[tool.setuptools]
packages = ["planner_core", "baselines", "benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
